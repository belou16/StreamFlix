<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiche série · StreamFlix</title>
    <meta
      name="description"
      content="Fiche détaillée d'une série sur StreamFlix : affiche, note, genres, chaîne de diffusion, statut et résumé."
    />

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body data-page="show">
    <a class="skip-link" href="#main">Aller au contenu principal</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Stream<span class="logo-accent">Flix</span></a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
          <span class="visually-hidden">Menu</span>
          <span class="menu-toggle-icon" aria-hidden="true"></span>
        </button>

        <nav id="main-nav" class="main-nav" aria-label="Navigation principale">
          <ul class="nav-list">
            <li><a class="nav-link" href="index.html">Catalogue</a></li>
            <li>
              <a class="nav-link" href="liste.html">
                Ma liste
                <span class="visually-hidden">séries retenues :</span>
                <span class="nav-count" data-watchlist-count>0</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="container page">
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Retour au catalogue</a>

      <div id="show-status" aria-live="polite"></div>

      <article id="show-detail" class="show-detail" hidden>
        <div id="show-poster" class="show-detail-poster"></div>

        <div class="show-detail-header">
          <h1 id="show-title" class="show-detail-title"></h1>
          <p id="show-rating" class="rating"></p>

          <dl class="facts">
            <div class="fact">
              <dt>Année</dt>
              <dd id="show-year"></dd>
            </div>
            <div class="fact">
              <dt>Chaîne</dt>
              <dd id="show-network"></dd>
            </div>
            <div class="fact">
              <dt>Statut</dt>
              <dd id="show-airing-status"></dd>
            </div>
          </dl>

          <ul id="show-genres" class="tag-list" aria-label="Genres"></ul>
        </div>

        <div class="show-detail-actions">
          <button id="watchlist-button" class="button button-primary button-block" type="button">
            Ajouter à ma liste
          </button>
          <p id="watchlist-feedback" class="feedback" aria-live="polite"></p>
        </div>

        <section class="show-detail-summary" aria-labelledby="summary-title">
          <h2 id="summary-title" class="section-title">Résumé</h2>
          <div id="show-summary" class="summary"></div>
        </section>
      </article>

      <noscript>
        <p class="noscript">Activez JavaScript pour afficher la fiche de la série.</p>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 StreamFlix · Données fournies par <a href="https://www.tvmaze.com">TVMaze</a></p>
      </div>
    </footer>
  </body>
</html>
